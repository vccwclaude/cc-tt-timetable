<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CC and TT's Timetable - August 2026</title>
<style>
  html, body { margin:0; width:100%; height:100%; overflow:hidden; background:#fff; }
  .page-frame { position:fixed; inset:0; width:100%; height:100%; border:0; background:#fff; }
</style>
</head>
<body>
<iframe id="calendarFrame" class="page-frame" src="app.html" title="CC and TT's Timetable"></iframe>
<script>
  const frame = document.getElementById('calendarFrame');
  frame.addEventListener('load', () => {
    const doc = frame.contentDocument;
    if (!doc || doc.getElementById('sticker-background-fix')) return;

    const style = doc.createElement('style');
    style.id = 'sticker-background-fix';
    style.textContent = `
      #root > div {
        position: relative !important;
        isolation: isolate;
      }
      #root > div::before {
        content: "";
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        background-image: url("sticker-tile.svg");
        background-repeat: repeat;
        background-size: 256px 256px;
        background-position: 0 0;
        opacity: 0.15;
      }
      #root > div > * {
        position: relative;
        z-index: 1;
      }

      /* Keep the calendar column at its natural content height instead of
         stretching to match the photo rail. */
      .calendar-layout {
        align-items: start !important;
      }
      .photo-rail {
        min-height: 0 !important;
      }

      @media (max-width: 1050px) {
        .photo-rail {
          height: 220px !important;
        }
      }
    `;
    doc.head.appendChild(style);

    const syncPhotoRailHeight = () => {
      if (frame.contentWindow.innerWidth <= 1050) return;
      const layout = doc.querySelector('.calendar-layout');
      const rail = doc.querySelector('.photo-rail');
      if (!layout || !rail) return;

      const calendarColumn = [...layout.children].find(el => !el.classList.contains('photo-rail'));
      if (!calendarColumn) return;

      rail.style.height = 'auto';
      const height = Math.ceil(calendarColumn.getBoundingClientRect().height);
      if (height > 0) rail.style.height = `${height}px`;
    };

    const syncSoon = () => {
      requestAnimationFrame(syncPhotoRailHeight);
      setTimeout(syncPhotoRailHeight, 250);
      setTimeout(syncPhotoRailHeight, 900);
    };

    syncSoon();
    frame.contentWindow.addEventListener('resize', syncSoon);
    new MutationObserver(syncSoon).observe(doc.body, { subtree: true, childList: true });
  });
</script>
</body>
</html>
