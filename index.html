<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CC and TT's Timetable - August 2026</title>
<style>
  html, body { margin:0; width:100%; height:100%; overflow:hidden; background:#fff; }
  .page-frame { position:fixed; inset:0; width:100%; height:100%; border:0; background:#fff; }
</style>
</head>
<body>
<iframe id="calendarFrame" class="page-frame" src="app.html" title="CC and TT's Timetable"></iframe>
<script>
  const frame = document.getElementById('calendarFrame');
  frame.addEventListener('load', () => {
    const doc = frame.contentDocument;
    if (!doc || doc.getElementById('sticker-background-fix')) return;
    const style = doc.createElement('style');
    style.id = 'sticker-background-fix';
    style.textContent = `
      #root > div {
        position: relative !important;
        isolation: isolate;
      }
      #root > div::before {
        content: "";
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        background-image: url("sticker-tile.svg");
        background-repeat: repeat;
        background-size: 256px 256px;
        background-position: 0 0;
        opacity: 0.15;
      }
      #root > div > * {
        position: relative;
        z-index: 1;
      }
    `;
    doc.head.appendChild(style);
  });
</script>
</body>
</html>
