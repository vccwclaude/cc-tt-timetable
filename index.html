const MONTHS = [{ name: "August 2026", year: 2026, month: 7 }];
const DAYS = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];

  "2026-08-11": [

    { label: "First Little Steps", time: "2:00 PM – 5:00 PM", color: "#FF8C42" },
  ],
  "2026-08-12": [{ label: "Jollykingdom", time: "10:00 AM", color: "#D4A5FF" }],
  "2026-08-13": [
    { label: "Taekwondo", time: "10:00 – 10:40 AM", color: "#87CEEB" },
    { label: "First Little Steps", time: "2:00 PM – 5:00 PM", color: "#FF8C42" },
  ],
  "2026-08-15": [
    { label: "TT Littlehab", time: "8:45 AM", color: "#2196F3" },

  ],

  "2026-08-22": [

  "2026-08-25": [{ label: "Art Class", time: "10:00 AM", color: "#85CDCA" }],
  "2026-08-26": [
    { label: "Jollykingdom", time: "10:00 AM", color: "#D4A5FF" },
    { label: "Shatin Final Rehearsal", time: "10:30 AM – 12:30 PM", color: "#E91E63" },
  ],
  "2026-08-27": [{ label: "Taekwondo", time: "10:00 – 10:40 AM", color: "#87CEEB" }],
  "2026-08-29": [
    { label: "TT Littlehab", time: "8:45 AM", color: "#2196F3" },
    { label: "Bear Music", time: "11:15 AM", color: "#FFD700" },
  ],
};

const HOLIDAY_START = new Date(2026, 6, 16);
const HOLIDAY_END = new Date(2026, 7, 25);
const PUBLIC_HOLIDAYS = ["2026-07-01"];

function isHoliday(date) { return date >= HOLIDAY_START && date <= HOLIDAY_END; }
function isPublicHoliday(date) {
  const k = date.getFullYear()+"-"+String(date.getMonth()+1).padStart(2,"0")+"-"+String(date.getDate()).padStart(2,"0");
  return PUBLIC_HOLIDAYS.includes(k);
}
function isSchoolDay(date) {
  const day = date.getDay();
  if (day === 0 || day === 6) return false;
  if (isPublicHoliday(date)) return false;
  return !isHoliday(date);
}
function getKey(date) {
  return date.getFullYear()+"-"+String(date.getMonth()+1).padStart(2,"0")+"-"+String(date.getDate()).padStart(2,"0");
}
function parseTime(timeStr) {
  if (!timeStr || timeStr === "All Day" || timeStr === "TBC") return null;
  const clean = timeStr.replace(/\u2013/g, "-").replace(/–/g, "-");
  const parts = clean.split("-").map(s => s.trim());
  const toMin = (t) => {
    const m = t.match(/(\d{1,2}):(\d{2})\s*(AM|PM)/i);
    if (!m) return null;
    let h = parseInt(m[1]); const mn = parseInt(m[2]); const ap = m[3].toUpperCase();
    if (ap === "PM" && h !== 12) h += 12;
    if (ap === "AM" && h === 12) h = 0;
    return h * 60 + mn;
  };
  if (parts.length === 2) return { start: toMin(parts[0]), end: toMin(parts[1]) };
  const s = toMin(parts[0]);
  return s !== null ? { start: s, end: s + 60 } : null;
}
function hasClash(events) {
  if (!events || events.length < 2) return false;
  const hasAllDay = events.some(e => e.time === "All Day");
  const nonAll = events.filter(e => e.time !== "All Day" && e.time !== "TBC");
  if (hasAllDay && nonAll.length > 0) return true;
  const parsed = nonAll.map(e => parseTime(e.time)).filter(p => p && p.start !== null && p.end !== null);
  for (let i = 0; i < parsed.length; i++)
    for (let j = i+1; j < parsed.length; j++)
      if (parsed[i].start < parsed[j].end && parsed[j].start < parsed[i].end) return true;
  return false;
}
function getCalendarDays(year, month) {
  let startDay = new Date(year, month, 1).getDay();
  const days = [];
  for (let i = 0; i < startDay; i++) days.push(null);
  const last = new Date(year, month + 1, 0).getDate();
  for (let d = 1; d <= last; d++) days.push(new Date(year, month, d));
  return days;
}

const COLOR_OPTIONS = [
  { name: "Red", hex: "#FF6B6B" }, { name: "Orange", hex: "#FF8C42" },
  { name: "Yellow", hex: "#FFD700" }, { name: "Gold", hex: "#FFD93D" },
  { name: "Green", hex: "#4CAF50" }, { name: "Teal", hex: "#85CDCA" },
  { name: "Light Blue", hex: "#87CEEB" }, { name: "Blue", hex: "#2196F3" },
  { name: "Purple", hex: "#9B59B6" }, { name: "Lavender", hex: "#D4A5FF" },
  { name: "Pink", hex: "#E91E63" }, { name: "Brown", hex: "#8D6E63" },
];
const DAY_OPTIONS = ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];

const btnBase = { border: "none", borderRadius: 10, fontFamily: "'Nunito', sans-serif", fontWeight: 700, cursor: "pointer", transition: "all 0.2s ease" };
const inputStyle = { width: "100%", padding: "10px 12px", borderRadius: 8, border: "1.5px solid #E0E0E0", fontFamily: "'Nunito', sans-serif", fontSize: 14, fontWeight: 600, outline: "none", boxSizing: "border-box" };
const labelStyle = { fontSize: 12, fontWeight: 700, color: "#636E72", marginBottom: 4, display: "block" };

function Modal({ title, onClose, children }) {
  return React.createElement("div", { style: { position:"fixed",top:0,left:0,right:0,bottom:0,background:"rgba(0,0,0,0.4)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:1000,padding:16 }, onClick: onClose },
    React.createElement("div", { style: { background:"#fff",borderRadius:20,padding:"24px 28px",maxWidth:420,width:"100%",boxShadow:"0 20px 60px rgba(0,0,0,0.15)",maxHeight:"85vh",overflowY:"auto" }, onClick: e => e.stopPropagation() },
      React.createElement("div", { style: { display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20 } },
        React.createElement("h3", { style: { margin:0,fontSize:18,fontWeight:800,color:"#2D3436",fontFamily:"'Nunito', sans-serif" } }, title),
        React.createElement("button", { onClick: onClose, style: { ...btnBase, background:"#F0F0F0", padding:"6px 12px", fontSize:16 } }, "✕")
      ),
      children
    )
  );
}

function CCCalendar() {
  const [activeMonth, setActiveMonth] = useState(0);
  const [selectedDate, setSelectedDate] = useState(null);
  const [events, setEvents] = useState(INITIAL_EVENTS);
  const [showAddEvent, setShowAddEvent] = useState(false);
  const [showRecurring, setShowRecurring] = useState(false);
  const [showLabels, setShowLabels] = useState(false);
  const [hasUnsaved, setHasUnsaved] = useState(false);
  const [saveStatus, setSaveStatus] = useState("");
  const [dragInfo, setDragInfo] = useState(null);
  const [dropTarget, setDropTarget] = useState(null);
  const [editInfo, setEditInfo] = useState(null);
  const [editLabel, setEditLabel] = useState("");
  const [editTime, setEditTime] = useState("");
  const [editColor, setEditColor] = useState("#2196F3");
  const [newLabel, setNewLabel] = useState("");
  const [newDate, setNewDate] = useState("");
  const [newTime, setNewTime] = useState("");
  const [newColor, setNewColor] = useState("#2196F3");
  const [recLabel, setRecLabel] = useState("");
  const [recDay, setRecDay] = useState("Monday");
  const [recTime, setRecTime] = useState("");
  const [recColor, setRecColor] = useState("#4CAF50");
  const [recFrom, setRecFrom] = useState("2026-08-01");
  const [recTo, setRecTo] = useState("2026-08-31");

  useEffect(() => {
    try {
      const saved = localStorage.getItem("cc-tt-timetable-events");
      if (saved) setEvents(JSON.parse(saved));
    } catch(e) {}
  }, []);

  const updateEvents = (ne) => { setEvents(ne); setHasUnsaved(true); setSaveStatus(""); };
  const saveChanges = () => {
    try { localStorage.setItem("cc-tt-timetable-events", JSON.stringify(events)); setHasUnsaved(false); setSaveStatus("saved"); setTimeout(() => setSaveStatus(""), 2500); }
    catch(e) { setSaveStatus("error"); setTimeout(() => setSaveStatus(""), 3000); }
  };

  const current = MONTHS[activeMonth];
  const days = getCalendarDays(current.year, current.month);
  const selectedKey = selectedDate ? getKey(selectedDate) : null;

  const addEvent = () => {
    if (!newLabel || !newDate || !newTime) return;
    const updated = { ...events };
    if (!updated[newDate]) updated[newDate] = [];
    updated[newDate] = [...updated[newDate], { label: newLabel, time: newTime, color: newColor }];
    updateEvents(updated);
    setNewLabel(""); setNewDate(""); setNewTime(""); setNewColor("#2196F3");
    setShowAddEvent(false);
  };
  const addRecurring = () => {
    if (!recLabel || !recTime) return;
    const dayIdx = DAY_OPTIONS.indexOf(recDay);
    const jsDayIdx = dayIdx === 6 ? 0 : dayIdx + 1;
    const updated = { ...events };
    const start = new Date(recFrom + "T00:00:00"); const end = new Date(recTo + "T00:00:00");
    for (let d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) {
      if (d.getDay() === jsDayIdx) { const key = getKey(d); if (!updated[key]) updated[key] = []; updated[key] = [...updated[key], { label: recLabel, time: recTime, color: recColor }]; }
    }
    updateEvents(updated); setRecLabel(""); setRecTime(""); setRecColor("#4CAF50"); setShowRecurring(false);
  };

  const allLabels = {};
  Object.values(events).forEach(evList => evList.forEach(ev => { allLabels[ev.label] = ev.color; }));
  const updateLabelColor = (label, newHex) => {
    const updated = {}; Object.entries(events).forEach(([k, v]) => { updated[k] = v.map(ev => ev.label === label ? { ...ev, color: newHex } : ev); }); updateEvents(updated);
  };

  const handleDragStart = (e, dateKey, evIdx) => { setDragInfo({ dateKey, evIdx }); e.dataTransfer.effectAllowed = "move"; e.dataTransfer.setData("text/plain", ""); };
  const handleDragOver = (e, dateKey) => { e.preventDefault(); e.dataTransfer.dropEffect = "move"; setDropTarget(dateKey); };
  const handleDragLeave = () => { setDropTarget(null); };
  const handleDrop = (e, targetKey) => {
    e.preventDefault(); setDropTarget(null);
    if (!dragInfo || dragInfo.dateKey === targetKey) { setDragInfo(null); return; }
    const updated = { ...events }; const srcList = [...(updated[dragInfo.dateKey] || [])]; const movedEvent = srcList[dragInfo.evIdx];
    if (!movedEvent) { setDragInfo(null); return; }
    srcList.splice(dragInfo.evIdx, 1);
    if (srcList.length === 0) delete updated[dragInfo.dateKey]; else updated[dragInfo.dateKey] = srcList;
    if (!updated[targetKey]) updated[targetKey] = []; updated[targetKey] = [...updated[targetKey], movedEvent];
    updateEvents(updated); setDragInfo(null);
  };
  const handleDragEnd = () => { setDragInfo(null); setDropTarget(null); };

  const openEditEvent = (dateKey, evIdx) => { const ev = events[dateKey]?.[evIdx]; if (!ev) return; setEditInfo({ dateKey, evIdx }); setEditLabel(ev.label); setEditTime(ev.time); setEditColor(ev.color); };
  const saveEditEvent = () => {
    if (!editInfo || !editLabel || !editTime) return;
    const updated = { ...events }; const list = [...(updated[editInfo.dateKey] || [])];
    list[editInfo.evIdx] = { label: editLabel, time: editTime, color: editColor }; updated[editInfo.dateKey] = list;
    updateEvents(updated); setEditInfo(null);
  };
  const deleteEditEvent = () => {
    if (!editInfo) return;
    const updated = { ...events }; const list = [...(updated[editInfo.dateKey] || [])]; list.splice(editInfo.evIdx, 1);
    if (list.length === 0) delete updated[editInfo.dateKey]; else updated[editInfo.dateKey] = list;
    updateEvents(updated); setEditInfo(null);
  };

  return (
    <div style={{ fontFamily:"'Nunito','Quicksand',sans-serif", background:"linear-gradient(135deg, #FFF8E7 0%, #FFF0D4 50%, #E8F4FD 100%)", minHeight:"100vh", padding:"24px 16px", boxSizing:"border-box" }}>
      <div style={{ maxWidth:1100, margin:"0 auto" }}>
        <div style={{ textAlign:"center", marginBottom:20 }}>
          <div style={{ fontSize:14, fontWeight:700, letterSpacing:3, textTransform:"uppercase", color:"#B8860B", marginBottom:4, fontFamily:"'Quicksand',sans-serif" }}>Summer 2026</div>
          <h1 style={{ fontSize:28, fontWeight:800, color:"#2D3436", margin:"0 0 6px 0", fontFamily:"'Nunito',sans-serif" }}>CC and TT's Timetable ☀️</h1>
          <div style={{ fontSize:13, color:"#636E72", fontWeight:600 }}>School holiday: 16 July – 25 August</div>
        </div>

        <div style={{ display:"flex", flexWrap:"wrap", justifyContent:"center", gap:8, marginBottom:20 }}>
          <button onClick={() => setShowAddEvent(true)} style={{ ...btnBase, background:"linear-gradient(135deg, #0984E3, #74B9FF)", color:"#fff", padding:"10px 20px", fontSize:13, boxShadow:"0 3px 10px rgba(9,132,227,0.3)" }}>+ Add Event</button>
          <button onClick={() => setShowRecurring(true)} style={{ ...btnBase, background:"linear-gradient(135deg, #00B894, #55EFC4)", color:"#fff", padding:"10px 20px", fontSize:13, boxShadow:"0 3px 10px rgba(0,184,148,0.3)" }}>🔄 Recurring Event</button>
          <button onClick={() => setShowLabels(true)} style={{ ...btnBase, background:"linear-gradient(135deg, #A29BFE, #6C5CE7)", color:"#fff", padding:"10px 20px", fontSize:13, boxShadow:"0 3px 10px rgba(108,92,231,0.3)" }}>🎨 Color Labels</button>
          <button onClick={saveChanges} style={{ ...btnBase, padding:"10px 20px", fontSize:13, background: hasUnsaved ? "linear-gradient(135deg, #E74C3C, #FF6B6B)" : "linear-gradient(135deg, #B2BEC3, #DFE6E9)", color:"#fff", boxShadow: hasUnsaved ? "0 3px 10px rgba(231,76,60,0.3)" : "none", animation: hasUnsaved ? "pulse 2s infinite" : "none" }}>
            {saveStatus === "saved" ? "✓ Saved!" : saveStatus === "error" ? "✕ Error" : hasUnsaved ? "💾 Save Changes" : "💾 Saved"}
          </button>
        </div>

        <div style={{ display:"flex", justifyContent:"center", marginBottom:24 }}>
          <div style={{ ...btnBase, padding:"10px 28px", fontSize:15, background:"linear-gradient(135deg, #FF9A56, #FF6B6B)", color:"#fff", boxShadow:"0 4px 15px rgba(255,107,107,0.35)" }}>August 2026</div>
        </div>

        <div style={{ background:"#fff", borderRadius:20, padding:20, boxShadow:"0 8px 30px rgba(0,0,0,0.07)" }}>
          <div style={{ display:"grid", gridTemplateColumns:"repeat(7, 1fr)", gap:4 }}>
            {DAYS.map(d => (
              <div key={d} style={{ textAlign:"center", fontSize:12, fontWeight:700, color: d==="Sat"||d==="Sun" ? "#E17055" : "#B2BEC3", padding:"6px 0", fontFamily:"'Quicksand',sans-serif", textTransform:"uppercase", letterSpacing:1 }}>{d}</div>
            ))}
            {days.map((date, idx) => {
              if (!date) return <div key={"e-"+idx} style={{ minHeight:110 }} />;
              const key = getKey(date);
              const evs = events[key] || [];
              const holiday = isHoliday(date);
              const isWknd = date.getDay() === 0 || date.getDay() === 6;
              const isSel = selectedKey === key;
              const ph = isPublicHoliday(date);
              const clash = hasClash(evs);
              const today = new Date(); today.setHours(0,0,0,0);
              const isPast = date < today;
              const isToday = date.getTime() === today.getTime();
              return (
                <div key={key}
                  onClick={() => setSelectedDate(isSel ? null : date)}
                  onDoubleClick={() => { setNewDate(key); setShowAddEvent(true); }}
                  onDragOver={e => handleDragOver(e, key)}
                  onDragLeave={handleDragLeave}
                  onDrop={e => handleDrop(e, key)}
                  style={{
                    minHeight:110, borderRadius:12, padding:"6px 3px", cursor:"pointer",
                    transition:"all 0.2s ease", overflow:"hidden",
                    border: isToday ? "2px solid #E74C3C" : dropTarget===key ? "2px dashed #0984E3" : isSel ? "2px solid #FF6B6B" : "2px solid transparent",
                    background: isPast ? "#F0F0F0" : dropTarget===key ? "#E3F2FD" : ph ? "#E8F5E9" : holiday ? "linear-gradient(135deg, #FFF8E1, #FFF3D6)" : isWknd ? "#FAFAFA" : "#fff",
                    position:"relative", opacity: isPast ? 0.5 : 1,
                  }}>
                  {clash && !isPast && <div style={{ position:"absolute", top:3, right:5, fontSize:10, color:"#E74C3C", fontWeight:800 }}>⭐</div>}
                  <div style={{ fontSize:14, fontWeight:700, color: isPast ? "#B0B0B0" : isWknd ? "#E17055" : "#2D3436", textAlign:"center", marginBottom:4 }}>{date.getDate()}</div>
                  {ph && <div style={{ fontSize:8, fontWeight:700, color: isPast?"#B0B0B0":"#2E7D32", textAlign:"center", letterSpacing:0.5, marginBottom:2 }}>PH</div>}
                  <div style={{ display:"flex", flexDirection:"column", gap:4, minWidth:0, width:"100%" }}>
                    {evs.map((ev, i) => (
                      <div key={i}
                        draggable={!isPast}
                        onDragStart={e => { e.stopPropagation(); handleDragStart(e, key, i); }}
                        onDragEnd={handleDragEnd}
                        onDoubleClick={e => { e.stopPropagation(); if (!isPast) openEditEvent(key, i); }}
                        style={{
                          fontSize:9, fontWeight:700, background: isPast ? "#CCCCCC" : ev.color, color: isPast ? "#999" : "#fff",
                          borderRadius:4, padding:"3px 4px", textAlign:"center", lineHeight:1.2,
                          textShadow: isPast ? "none" : "0 1px 2px rgba(0,0,0,0.15)",
                          cursor: isPast ? "default" : "grab",
                          opacity: dragInfo && dragInfo.dateKey===key && dragInfo.evIdx===i ? 0.4 : 1,
                          overflow:"hidden", minWidth:0, maxWidth:"100%", boxSizing:"border-box",
                        }}>
                        <div style={{ fontSize:8, fontWeight:800, opacity:0.85, marginBottom:1 }}>{ev.time}</div>
                        <div style={{ whiteSpace:"nowrap", overflow:"hidden", textOverflow:"ellipsis" }}>{ev.label}</div>
                      </div>
                    ))}
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      </div>

      {showAddEvent && <Modal title="Add Event" onClose={() => setShowAddEvent(false)}>
        <div style={{marginBottom:14}}><label style={labelStyle}>Event Name</label><input style={inputStyle} value={newLabel} onChange={e => setNewLabel(e.target.value)} placeholder="e.g. Swimming Class" /></div>
        <div style={{marginBottom:14}}><label style={labelStyle}>Date</label><input type="date" style={inputStyle} value={newDate} onChange={e => setNewDate(e.target.value)} min="2026-08-01" max="2026-08-31" /></div>
        <div style={{marginBottom:14}}><label style={labelStyle}>Time</label><input style={inputStyle} value={newTime} onChange={e => setNewTime(e.target.value)} placeholder="e.g. 10:00 AM or 2:00 PM – 4:00 PM" /></div>
        <div style={{marginBottom:20}}><label style={labelStyle}>Color</label><div style={{display:"flex",flexWrap:"wrap",gap:8}}>
          {COLOR_OPTIONS.map(c => <div key={c.hex} onClick={() => setNewColor(c.hex)} style={{ width:32, height:32, borderRadius:8, background:c.hex, cursor:"pointer", border: newColor===c.hex ? "3px solid #2D3436" : "3px solid transparent", transition:"all 0.15s ease" }} title={c.name} />)}
        </div></div>
        <button onClick={addEvent} style={{ ...btnBase, width:"100%", padding:"12px", fontSize:15, background:"linear-gradient(135deg, #0984E3, #74B9FF)", color:"#fff" }}>Add Event</button>
      </Modal>}

      {showRecurring && <Modal title="Add Recurring Event" onClose={() => setShowRecurring(false)}>
        <div style={{marginBottom:14}}><label style={labelStyle}>Event Name</label><input style={inputStyle} value={recLabel} onChange={e => setRecLabel(e.target.value)} placeholder="e.g. Swimming Class" /></div>
        <div style={{marginBottom:14}}><label style={labelStyle}>Day of Week</label><select style={inputStyle} value={recDay} onChange={e => setRecDay(e.target.value)}>{DAY_OPTIONS.map(d => <option key={d} value={d}>{d}</option>)}</select></div>
        <div style={{marginBottom:14}}><label style={labelStyle}>Time</label><input style={inputStyle} value={recTime} onChange={e => setRecTime(e.target.value)} placeholder="e.g. 10:00 AM or 2:00 PM – 4:00 PM" /></div>
        <div style={{display:"flex",gap:10,marginBottom:14}}>
          <div style={{flex:1}}><label style={labelStyle}>From</label><input type="date" style={inputStyle} value={recFrom} onChange={e => setRecFrom(e.target.value)} /></div>
          <div style={{flex:1}}><label style={labelStyle}>To</label><input type="date" style={inputStyle} value={recTo} onChange={e => setRecTo(e.target.value)} /></div>
        </div>
        <div style={{marginBottom:20}}><label style={labelStyle}>Color</label><div style={{display:"flex",flexWrap:"wrap",gap:8}}>
          {COLOR_OPTIONS.map(c => <div key={c.hex} onClick={() => setRecColor(c.hex)} style={{ width:32, height:32, borderRadius:8, background:c.hex, cursor:"pointer", border: recColor===c.hex ? "3px solid #2D3436" : "3px solid transparent", transition:"all 0.15s ease" }} title={c.name} />)}
        </div></div>
        <button onClick={addRecurring} style={{ ...btnBase, width:"100%", padding:"12px", fontSize:15, background:"linear-gradient(135deg, #00B894, #55EFC4)", color:"#fff" }}>Add Recurring Event</button>
      </Modal>}

      {showLabels && <Modal title="Color Labels" onClose={() => setShowLabels(false)}>
        <div style={{fontSize:12,color:"#636E72",fontWeight:600,marginBottom:16}}>Tap a color swatch to change the color for that activity across all dates.</div>
        {Object.entries(allLabels).sort((a,b) => a[0].localeCompare(b[0])).map(([label, color]) => (
          <div key={label} style={{ display:"flex",alignItems:"center",justifyContent:"space-between",padding:"10px 0",borderBottom:"1px solid #F0F0F0" }}>
            <div style={{display:"flex",alignItems:"center",gap:10}}>
              <div style={{ width:16,height:16,borderRadius:4,background:color }} />
              <span style={{ fontSize:14,fontWeight:700,color:"#2D3436" }}>{label}</span>
            </div>
            <div style={{display:"flex",gap:4}}>
              {COLOR_OPTIONS.map(c => <div key={c.hex} onClick={() => updateLabelColor(label, c.hex)} style={{ width:22,height:22,borderRadius:6,background:c.hex,cursor:"pointer",border: color===c.hex ? "2px solid #2D3436" : "2px solid transparent",transition:"all 0.15s ease" }} title={c.name} />)}
            </div>
          </div>
        ))}
      </Modal>}

      {editInfo && <Modal title="Edit Event" onClose={() => setEditInfo(null)}>
        <div style={{marginBottom:14}}><label style={labelStyle}>Event Name</label><input style={inputStyle} value={editLabel} onChange={e => setEditLabel(e.target.value)} /></div>
        <div style={{marginBottom:14}}><label style={labelStyle}>Time</label><input style={inputStyle} value={editTime} onChange={e => setEditTime(e.target.value)} /></div>
        <div style={{marginBottom:20}}><label style={labelStyle}>Color</label><div style={{display:"flex",flexWrap:"wrap",gap:8}}>
          {COLOR_OPTIONS.map(c => <div key={c.hex} onClick={() => setEditColor(c.hex)} style={{ width:32,height:32,borderRadius:8,background:c.hex,cursor:"pointer",border: editColor===c.hex ? "3px solid #2D3436" : "3px solid transparent",transition:"all 0.15s ease" }} title={c.name} />)}
        </div></div>
        <div style={{display:"flex",gap:10}}>
          <button onClick={saveEditEvent} style={{ ...btnBase, flex:1, padding:"12px", fontSize:14, background:"linear-gradient(135deg, #0984E3, #74B9FF)", color:"#fff" }}>Save</button>
          <button onClick={deleteEditEvent} style={{ ...btnBase, flex:1, padding:"12px", fontSize:14, background:"linear-gradient(135deg, #E74C3C, #FF7675)", color:"#fff" }}>Delete</button>
        </div>
      </Modal>}
    </div>
  );
}

ReactDOM.render(React.createElement(CCCalendar), document.getElementById("root"));
</script>
</body>
</html>
