function isHoliday(date) { return date >= HOLIDAY_START && date <= HOLIDAY_END; }
function isPublicHoliday(date) {
  const k = date.getFullYear()+"-"+String(date.getMonth()+1).padStart(2,"0")+"-"+String(date.getDate()).padStart(2,"0");

function getKey(date) {
  return date.getFullYear()+"-"+String(date.getMonth()+1).padStart(2,"0")+"-"+String(date.getDate()).padStart(2,"0");
}
function getDateKeysBetween(startKey, endKey) {
  const [first, last] = [startKey, endKey].sort();
  const keys = [];
  for (let date = new Date(first+"T00:00:00"), end = new Date(last+"T00:00:00"); date <= end; date.setDate(date.getDate()+1)) keys.push(getKey(date));
  return keys;
}
function parseTime(timeStr) {
  if (!timeStr || timeStr === "All Day" || timeStr === "TBC") return null;
  const clean = timeStr.replace(/\u2013/g, "-").replace(/–/g, "-");
  const parts = clean.split("-").map(s => s.trim());
  const toMin = (t) => {
    const m = t.match(/(\d{1,2}):(\d{2})\s*(AM|PM)/i);
    if (!m) return null;
    let h = parseInt(m[1]); const mn = parseInt(m[2]); const ap = m[3].toUpperCase();
    if (ap === "PM" && h !== 12) h += 12; if (ap === "AM" && h === 12) h = 0;
    return h * 60 + mn;
  };
  if (parts.length === 2) return { start: toMin(parts[0]), end: toMin(parts[1]) };
  const s = toMin(parts[0]);
  return s !== null ? { start: s, end: s + 60 } : null;
}
function hasClash(events) {
  if (!events || events.length < 2) return false;
  const hasAllDay = events.some(e => e.time === "All Day");
  const nonAll = events.filter(e => e.time !== "All Day" && e.time !== "TBC");
  if (hasAllDay && nonAll.length > 0) return true;
  const parsed = nonAll.map(e => parseTime(e.time)).filter(p => p && p.start !== null && p.end !== null);
  for (let i = 0; i < parsed.length; i++)
    for (let j = i+1; j < parsed.length; j++)
      if (parsed[i].start < parsed[j].end && parsed[j].start < parsed[i].end) return true;
  return false;
}

}

function buildCalendarWeeks(days, events) {
  const runs = [];
  let previous = new Map();
  Object.keys(events).sort().forEach(date => {
    const current = new Map();
    (events[date] || []).forEach((event, evIdx) => {
      const signature = JSON.stringify([event.label, event.time || "", event.color, event.rangeId || ""]);
      const candidates = previous.get(signature) || [];
      let run = candidates.shift();
      if (!run || Date.parse(date + "T12:00:00Z") - Date.parse(run.members[run.members.length - 1].dateKey + "T12:00:00Z") !== 86400000) {
        run = { event, members: [] };
        runs.push(run);
      }
      run.members.push({ dateKey: date, evIdx });
      if (!current.has(signature)) current.set(signature, []);
      current.get(signature).push(run);
    });
    previous = current;
  });
  const weeks = [];
  for (let offset = 0; offset < days.length; offset += 7) {
    const dates = days.slice(offset, offset + 7);
    while (dates.length < 7) dates.push(null);
    const keys = dates.map(date => date ? getKey(date) : null);
    const segments = runs.filter(run => run.members.length > 1).flatMap(run => {
      const visible = run.members.filter(member => keys.includes(member.dateKey));
      return visible.length ? [{ ...run, visible, start: keys.indexOf(visible[0].dateKey), end: keys.indexOf(visible[visible.length - 1].dateKey) }] : [];
    }).sort((a, b) => a.start - b.start || b.end - a.end);
    const lanes = [];
    const hidden = new Set();
    segments.forEach(segment => {
      let lane = lanes.findIndex(end => end < segment.start);
      if (lane < 0) lane = lanes.length;
      lanes[lane] = segment.end;
      segment.lane = lane;
      segment.visible.forEach(member => hidden.add(member.dateKey + ":" + member.evIdx));
    });
    weeks.push({ dates, segments, hidden, lanes: lanes.length });
  }
  return weeks;
}

function summarizeUpdates(events) {
  const groups = new Map();
  Object.entries(events).forEach(([date, items]) => items.forEach(event => {
    if (!event.updatedAt) return;
    const key = JSON.stringify([event.label, event.time || ""]);
    if (!groups.has(key)) groups.set(key, { ...event, dates: new Set() });
    const group = groups.get(key);
    group.dates.add(date);
    group.updatedAt = Math.max(group.updatedAt, event.updatedAt);
  }));
  const formatter = new Intl.DateTimeFormat("en-GB", { day:"numeric", month:"short", year:"numeric", timeZone:"UTC" });
  const asDate = date => new Date(date + "T12:00:00Z");
  return [...groups.values()].sort((a, b) => b.updatedAt - a.updatedAt).slice(0, 5).map(group => {
    const ranges = [];
    [...group.dates].sort().forEach(date => {
      const last = ranges[ranges.length - 1];
      if (last && asDate(date) - asDate(last[1]) === 86400000) last[1] = date;
      else ranges.push([date, date]);
    });
    return { ...group, date: ranges[0][0], dateSummary: ranges.map(([start, end]) =>
      start === end ? formatter.format(asDate(start)) : formatter.formatRange(asDate(start), asDate(end))
    ).join("; ") };
  });
}

function stampEventUpdates(previous, next, now = Date.now()) {
  const signature = ({ label, time, color, rangeId }) => JSON.stringify([label, time || "", color, rangeId || ""]);
  return Object.fromEntries(Object.entries(next).map(([date, items]) => {
    const remaining = [...(previous[date] || [])];
    return [date, items.map(event => {
      const index = remaining.findIndex(old => signature(old) === signature(event));
      if (index >= 0) return remaining.splice(index, 1)[0];
      return { ...event, updatedAt: now };
    })];
  }));
}

  const WEEKDAY_MAP = { sun:0,sunday:0,mon:1,monday:1,tue:2,tuesday:2,wed:3,wednesday:3,thu:4,thurs:4,thursday:4,fri:5,friday:5,sat:6,saturday:6 };
  const COLORS = ["#2196F3","#4CAF50","#FF8C42","#87CEEB","#9B59B6","#E91E63","#85CDCA","#D4A5FF","#FFD700","#FF6B6B","#8D6E63","#FFD93D"];
  const now = new Date(today); now.setHours(0,0,0,0);

  function to12h(h, m) {
    const mm = String(m).padStart(2,"0");

    if (h < 12) return h+":"+mm+" AM";

    let m = s.match(/^(\d{1,2}):(\d{2})$/);

    // 12h: 2pm, 10am, 2:30pm
    m = s.match(/^(\d{1,2})(?::(\d{2}))?\s*(am|pm)$/i);
    if (m) {
      let h = parseInt(m[1]); const mn = parseInt(m[2]||"0"); const ap = m[3].toUpperCase();

  function parseTimeRange(s) {
    s = s.replace(/\u2013/g,"-").replace(/–/g,"-").replace(/to/gi,"-").trim();
    const parts = s.split(/\s*-\s*/);
    if (parts.length === 2) {
      // If second part has am/pm but first doesn't, infer
      let t1 = parseTimeStr(parts[0]);
      let t2 = parseTimeStr(parts[1]);
      if (!t1 && t2) {
        const ampm = parts[1].match(/(am|pm)/i);
        if (ampm) t1 = parseTimeStr(parts[0] + ampm[1]);
      }
      if (t1 && t2) return t1 + " – " + t2;
      if (t1) return t1;
    }
    const single = parseTimeStr(s);
    if (single) return single;
    return null;
  }

  function parseDate(s) {
    s = s.replace(/\s+/g," ").trim();
    const makeDate = (month, day, year) => {
      const date = new Date(year, month - 1, day);
      return date.getFullYear() === year && date.getMonth() === month - 1 && date.getDate() === day ? { day, month, year } : null;
    };
    const inferredDate = (month, day) => {
      let year = now.getFullYear();
      if (new Date(year, month - 1, day) < now) year++;
      return makeDate(month, day, year);
    };
    // US numeric format: MM/DD/YYYY or MM-DD-YYYY or MM.DD.YYYY
    let m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})$/);
    if (m) return makeDate(parseInt(m[1]), parseInt(m[2]), parseInt(m[3]));
    // US numeric format: MM/DD or MM-DD or MM.DD
    m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})$/);
    if (m) return inferredDate(parseInt(m[1]), parseInt(m[2]));
    // DD Mon or DDMon or DD Month
    m = s.match(/^(\d{1,2})\s*([a-zA-Z]+)$/);
    if (m) { const mo = MONTH_MAP[m[2].toLowerCase()]; if (mo) return inferredDate(mo, parseInt(m[1])); }
    // Mon DD or Month DD
    m = s.match(/^([a-zA-Z]+)\s+(\d{1,2})$/);
    if (m) { const mo = MONTH_MAP[m[1].toLowerCase()]; if (mo) return inferredDate(mo, parseInt(m[2])); }
    // DDst/nd/rd/th Mon
    m = s.match(/^(\d{1,2})(?:st|nd|rd|th)?\s+([a-zA-Z]+)$/);
    if (m) { const mo = MONTH_MAP[m[2].toLowerCase()]; if (mo) return inferredDate(mo, parseInt(m[1])); }
    // Mon DDst/nd/rd/th
    m = s.match(/^([a-zA-Z]+)\s+(\d{1,2})(?:st|nd|rd|th)?$/);
    if (m) { const mo = MONTH_MAP[m[1].toLowerCase()]; if (mo) return inferredDate(mo, parseInt(m[2])); }
    return null;
  }

  function toKey(d) {
    return d.year+"-"+String(d.month).padStart(2,"0")+"-"+String(d.day).padStart(2,"0");
  }

  const results = [];
  const lines = text.split(/\n/).map(l => l.trim()).filter(l => l.length > 0);

  for (const line of lines) {
    // Try to find dates in the line
    // Pattern: date, time-range, label (flexible order)
    let remaining = line;
    let foundDates = [];
    let foundTime = null;
    let label = "";
    const recurring = line.match(/\bevery(?:thing)?\s+(sun(?:day)?|mon(?:day)?|tue(?:sday)?|wed(?:nesday)?|thu(?:rs(?:day)?)?|fri(?:day)?|sat(?:urday)?)\s+until\s+(\d{1,2}[\/\-.]\d{1,2}(?:[\/\-.]\d{4})?)/i);

    // Extract date patterns: MM/DD, MM/DD/YYYY, DD Mon, Mon DD, etc.
    const datePatterns = [
      /(\d{1,2}[\/\-\.]\d{1,2}[\/\-\.]\d{4})/g,
      /(\d{1,2}[\/\-\.]\d{1,2})(?!\d)/g,
      /(\d{1,2}(?:st|nd|rd|th)?\s+(?:jan(?:uary)?|feb(?:ruary)?|mar(?:ch)?|apr(?:il)?|may|june?|july?|aug(?:ust)?|sep(?:tember)?|oct(?:ober)?|nov(?:ember)?|dec(?:ember)?))/gi,
      /((?:jan(?:uary)?|feb(?:ruary)?|mar(?:ch)?|apr(?:il)?|may|june?|july?|aug(?:ust)?|sep(?:tember)?|oct(?:ober)?|nov(?:ember)?|dec(?:ember)?)\s+\d{1,2}(?:st|nd|rd|th)?)/gi,
    ];

    for (const pat of datePatterns) {
      let dm;
      while ((dm = pat.exec(remaining)) !== null) {
        const parsed = parseDate(dm[1]);
        if (parsed) foundDates.push({ parsed, raw: dm[0], idx: dm.index });
      }
    }
    foundDates = foundDates.filter((fd, i) => foundDates.findIndex(other => other.idx === fd.idx) === i);

    // Extract time patterns
    const timePatterns = [
      /(\d{1,2}(?::\d{2})?\s*(?:am|pm)\s*(?:[-–\u2013]|to)\s*\d{1,2}(?::\d{2})?\s*(?:am|pm))/gi,
      /(\d{1,2}:\d{2}\s*(?:[-–\u2013]|to)\s*\d{1,2}:\d{2})/g,
      /(\d{1,2}(?::\d{2})?\s*(?:am|pm))/gi,
      /(\d{1,2}:\d{2})(?!\d)/g,
    ];

    for (const pat of timePatterns) {
      if (foundTime) break;
      let tm;
      while ((tm = pat.exec(remaining)) !== null) {

        if (parsed) { foundTime = { parsed, raw: tm[0] }; break; }
      }

    // Build label from what's left
    let cleanLine = line;
    if (foundTime) cleanLine = cleanLine.replace(foundTime.raw, " ");

    if (recurring) cleanLine = cleanLine.replace(/\bevery(?:thing)?\s+(?:sun(?:day)?|mon(?:day)?|tue(?:sday)?|wed(?:nesday)?|thu(?:rs(?:day)?)?|fri(?:day)?|sat(?:urday)?)\s+until\b/i, " ");

    label = label.replace(/\b(mon(?:day)?|tue(?:sday)?|wed(?:nesday)?|thu(?:rsday)?|fri(?:day)?|sat(?:urday)?|sun(?:day)?)\b/gi, "").replace(/\s+/g," ").trim();
    label = label.replace(/^[\s,\-–:;|()\[\]]+|[\s,\-–:;|()\[\]]+$/g, "").trim();

    if (recurring) {
      const endParts = parseDate(recurring[2]);
      const targetDay = WEEKDAY_MAP[recurring[1].toLowerCase()];
      if (!endParts || targetDay === undefined) continue;
      const end = new Date(endParts.year, endParts.month - 1, endParts.day);
      const date = new Date(now); date.setDate(date.getDate() + 1);
      while (date.getDay() !== targetDay) date.setDate(date.getDate() + 1);
      const color = pickColor();
      while (date <= end) {
        results.push({
          date: toKey({ year:date.getFullYear(), month:date.getMonth()+1, day:date.getDate() }),
          label: label || "Event",
          time: foundTime ? foundTime.parsed : "",
          color,
        });
        date.setDate(date.getDate() + 7);
      }
      continue;
    }

    if (foundDates.length > 0 && (foundTime || label)) {
      const color = pickColor();
      for (const fd of foundDates) {
        results.push({
          date: toKey(fd.parsed),
          label: label || "Event",
          time: foundTime ? foundTime.parsed : "",
          color,
        });
      }
    }
  }
  return results;
}

              const evs = events[key] || [];
              const holiday = isHoliday(date);
              const isWknd = date.getDay() === 0 || date.getDay() === 6;
              const isSel = selectedKey === key;
              const ph = isPublicHoliday(date);
              const clash = hasClash(evs);
              const today = new Date(); today.setHours(0,0,0,0);
              const isPast = date < today;
              const isToday = date.getTime() === today.getTime();
              const isInDragRange = rangeFirst && key >= rangeFirst && key <= rangeLast;
              return (
                <div key={key} data-date={key}
                  onPointerDown={e => handleRangeStart(e, key)}
                  onPointerEnter={() => handleRangeEnter(key)}
                  onClick={() => { if (rangeDragged.current) { rangeDragged.current = false; return; } setSelectedEvent(null); setSelectedDate(isSel ? null : date); }}
                  onDoubleClick={() => { setSelectedEvent(null); setNewDate(key); setNewEndDate(""); setShowAddEvent(true); }}
                  onDragOver={e => handleDragOver(e, key)}
                  onDragLeave={handleDragLeave}
                  onDrop={e => handleDrop(e, key)}
                  style={{
                    minHeight:110, borderRadius:12, padding:"6px 3px", cursor:"pointer",
                    transition:"all 0.2s ease", overflow:"hidden",
                    border: dropTarget===key ? "2px dashed #0984E3" : isInDragRange ? "2px solid #0984E3" : isSel ? "2px solid #E74C3C" : "2px solid transparent",
                    background: isInDragRange ? "#DFF1FF" : isPast ? "#F0F0F0" : isToday ? "#BBDEFB" : dropTarget===key ? "#E3F2FD" : ph ? "#E8F5E9" : holiday ? "linear-gradient(135deg, #FFF8E1, #FFF3D6)" : isWknd ? "#FAFAFA" : "#fff",
                    position:"relative", opacity: isPast ? 0.5 : 1, userSelect:"none",
                  }}>
                  {clash && !isPast && <div style={{ position:"absolute", top:3, right:5, fontSize:10, color:"#E74C3C", fontWeight:800 }}>⭐</div>}
                  <div style={{ fontSize:14, fontWeight:700, color: isPast ? "#B0B0B0" : isWknd ? "#E17055" : "#2D3436", textAlign:"center", marginBottom:4 }}>{date.getDate()}</div>
                  {ph && <div style={{ fontSize:8, fontWeight:700, color: isPast?"#B0B0B0":"#2E7D32", textAlign:"center", letterSpacing:0.5, marginBottom:2 }}>PH</div>}
                  <div style={{ display:"flex", flexDirection:"column", gap:4, minWidth:0, width:"100%", marginTop:week.lanes ? week.lanes * 26 + 14 : 0 }}>
                    {evs.map((ev, i) => week.hidden.has(key + ":" + i) ? null : (
                      <div key={i}
                        role="button" tabIndex={0} aria-pressed={selectedEvent?.dateKey===key && selectedEvent.evIdx===i}
                        draggable={!isPast && !ev.rangeId}
                        onPointerDown={e => e.stopPropagation()}
                        onClick={e => { e.stopPropagation(); setSelectedEvent({ dateKey:key, evIdx:i }); setSelectedDate(date); }}
                        onKeyDown={e => { if (e.key==="Enter" || e.key===" ") { e.preventDefault(); setSelectedEvent({ dateKey:key, evIdx:i }); setSelectedDate(date); } }}
                        onDragStart={e => { e.stopPropagation(); handleDragStart(e, key, i); }}
                        onDragEnd={handleDragEnd}
                        onDoubleClick={e => { e.stopPropagation(); openEditEvent(key, i); }}
                        style={{
                          fontSize:9, fontWeight:700, background: isPast ? "#CCCCCC" : ev.color, color: isPast ? "#999" : "#fff",
                          borderRadius:4, padding:"3px 4px", textAlign:"center", lineHeight:1.2,
                          textShadow: isPast ? "none" : "0 1px 2px rgba(0,0,0,0.15)",
                          cursor: isPast || ev.rangeId ? "pointer" : "grab",
                          opacity: dragInfo && dragInfo.dateKey===key && dragInfo.evIdx===i ? 0.4 : 1,
                          outline: selectedEvent?.dateKey===key && selectedEvent.evIdx===i ? "3px solid #2D3436" : "none", outlineOffset:1,
                          overflow:"hidden", minWidth:0, maxWidth:"100%", boxSizing:"border-box",
                        }}>
                        {ev.time && <div style={{ fontSize:8, fontWeight:800, opacity:0.85, marginBottom:1 }}>{ev.time}</div>}
                        <div style={{ whiteSpace:"nowrap", overflow:"hidden", textOverflow:"ellipsis" }}>{ev.label}</div>
                      </div>
                    ))}
                  </div>
                </div>
              );
            })}
            {week.segments.length > 0 && <div style={{ position:"absolute", top:40, left:5, right:5, display:"grid", gridTemplateColumns:"repeat(7, minmax(0, 1fr))", gridAutoRows:22, gap:4, pointerEvents:"none" }}>
              {week.segments.map((segment, index) => {
                const first = segment.members[0], last = segment.members[segment.members.length - 1];
                const selected = segment.members.some(member => selectedEvent?.dateKey === member.dateKey && selectedEvent.evIdx === member.evIdx);
                const caption = segment.event.label + " · " + first.dateKey + " to " + last.dateKey;
                const select = () => { setSelectedEvent(first); setSelectedDate(new Date(first.dateKey + "T12:00:00")); };
                const edit = () => { openEditEvent(first.dateKey, first.evIdx); setEditInfo({ ...first, members:segment.members }); };
                return <button key={index} className="multi-day-event" title={caption} aria-label={caption} aria-pressed={selected}
                  onPointerDown={e => e.stopPropagation()} onClick={select} onDoubleClick={edit}
                  onKeyDown={e => { if (e.key === "Enter") { e.preventDefault(); select(); edit(); } }}
                  style={{ gridColumn:(segment.start + 1) + " / " + (segment.end + 2), gridRow:segment.lane + 1, pointerEvents:"auto", border:0, borderRadius:5, padding:"3px 6px", minWidth:0, overflow:"hidden", whiteSpace:"nowrap", textOverflow:"ellipsis", background:segment.event.color, color:"#fff", fontFamily:"inherit", fontSize:10, fontWeight:800, cursor:"pointer", outline:selected ? "2px solid #2D3436" : "none" }}>
                  {segment.visible[0].dateKey !== first.dateKey ? "‹ " : ""}{segment.event.label}{segment.event.time ? " · " + segment.event.time : ""}{segment.visible[segment.visible.length - 1].dateKey !== last.dateKey ? " ›" : ""}
                </button>;
              })}
            </div>}
            </div>)}
          </div>
          </div>
        </div>
        <LatestUpdates events={events} />
        </div>
      </div>

      {/* ADD EVENT */}
      {showAddEvent && <Modal title="Add Event" onClose={() => { setShowAddEvent(false); setNewEndDate(""); }}>
        <div style={{marginBottom:14}}><label style={labelStyle}>Event Name</label><input style={inputStyle} value={newLabel} onChange={e => setNewLabel(e.target.value)} placeholder="e.g. Swimming Class" /></div>
        <div style={{display:"flex",gap:10,marginBottom:14}}>
          <div style={{flex:1}}><label style={labelStyle}>Start Date</label><input type="date" style={inputStyle} value={newDate} onChange={e => setNewDate(e.target.value)} min="2026-08-01" max="2027-08-31" /></div>
          <div style={{flex:1}}><label style={labelStyle}>End Date</label><input type="date" style={inputStyle} value={newEndDate || newDate} onChange={e => setNewEndDate(e.target.value)} min={newDate || "2026-08-01"} max="2027-08-31" /></div>
        </div>
        <div style={{marginBottom:14}}><label style={labelStyle}>Time (optional)</label><input style={inputStyle} value={newTime} onChange={e => setNewTime(e.target.value)} placeholder="e.g. 10:00 AM or 2:00 PM – 4:00 PM" /></div>
        <div style={{marginBottom:20}}><label style={labelStyle}>Color</label><div style={{display:"flex",flexWrap:"wrap",gap:8}}>
          {COLOR_OPTIONS.map(c => <div key={c.hex} onClick={() => setNewColor(c.hex)} style={{ width:32, height:32, borderRadius:8, background:c.hex, cursor:"pointer", border: newColor===c.hex ? "3px solid #2D3436" : "3px solid transparent" }} title={c.name} />)}
        </div></div>
        <button onClick={addEvent} style={{ ...btnBase, width:"100%", padding:"12px", fontSize:15, background:"linear-gradient(135deg, #0984E3, #74B9FF)", color:"#fff" }}>Add Event</button>
      </Modal>}

      {/* RECURRING */}
      {showRecurring && <Modal title="Add Recurring Event" onClose={() => setShowRecurring(false)}>
        <div style={{marginBottom:14}}><label style={labelStyle}>Event Name</label><input style={inputStyle} value={recLabel} onChange={e => setRecLabel(e.target.value)} placeholder="e.g. Swimming Class" /></div>
        <div style={{marginBottom:14}}><label style={labelStyle}>Day of Week</label><select style={inputStyle} value={recDay} onChange={e => setRecDay(e.target.value)}>{DAY_OPTIONS.map(d => <option key={d} value={d}>{d}</option>)}</select></div>
        <div style={{marginBottom:14}}><label style={labelStyle}>Time (optional)</label><input style={inputStyle} value={recTime} onChange={e => setRecTime(e.target.value)} placeholder="e.g. 10:00 AM or 2:00 PM – 4:00 PM" /></div>
        <div style={{display:"flex",gap:10,marginBottom:14}}>
          <div style={{flex:1}}><label style={labelStyle}>From</label><input type="date" style={inputStyle} value={recFrom} onChange={e => setRecFrom(e.target.value)} /></div>
          <div style={{flex:1}}><label style={labelStyle}>To</label><input type="date" style={inputStyle} value={recTo} onChange={e => setRecTo(e.target.value)} /></div>
        </div>
        <div style={{marginBottom:20}}><label style={labelStyle}>Color</label><div style={{display:"flex",flexWrap:"wrap",gap:8}}>
          {COLOR_OPTIONS.map(c => <div key={c.hex} onClick={() => setRecColor(c.hex)} style={{ width:32, height:32, borderRadius:8, background:c.hex, cursor:"pointer", border: recColor===c.hex ? "3px solid #2D3436" : "3px solid transparent" }} title={c.name} />)}
        </div></div>
        <button onClick={addRecurring} style={{ ...btnBase, width:"100%", padding:"12px", fontSize:15, background:"linear-gradient(135deg, #00B894, #55EFC4)", color:"#fff" }}>Add Recurring Event</button>
      </Modal>}

      {/* COLOR LABELS */}
      {showLabels && <Modal title="Color Labels" onClose={() => setShowLabels(false)}>
        <div style={{fontSize:12,color:"#636E72",fontWeight:600,marginBottom:16}}>Tap a color swatch to change the color for that activity across all dates.</div>
        {Object.entries(allLabels).sort((a,b) => a[0].localeCompare(b[0])).map(([label, color]) => (
          <div key={label} style={{ display:"flex",alignItems:"center",justifyContent:"space-between",padding:"10px 0",borderBottom:"1px solid #F0F0F0" }}>
            <div style={{display:"flex",alignItems:"center",gap:10}}>
              <div style={{ width:16,height:16,borderRadius:4,background:color }} />
              <span style={{ fontSize:14,fontWeight:700,color:"#2D3436" }}>{label}</span>
            </div>
            <div style={{display:"flex",gap:4}}>
              {COLOR_OPTIONS.map(c => <div key={c.hex} onClick={() => updateLabelColor(label, c.hex)} style={{ width:22,height:22,borderRadius:6,background:c.hex,cursor:"pointer",border: color===c.hex ? "2px solid #2D3436" : "2px solid transparent" }} title={c.name} />)}
            </div>
          </div>
        ))}
      </Modal>}

      {/* EDIT EVENT */}
      {editInfo && <Modal title={editInfo.members ? "Edit Multi-day Event" : "Edit Event"} onClose={() => setEditInfo(null)}>
        {editInfo.members && <p style={{ fontSize:12, color:"#636E72", marginBottom:12 }}>Changes apply to all {editInfo.members.length} days in this span.</p>}
        <div style={{marginBottom:14}}><label style={labelStyle}>Event Name</label><input style={inputStyle} value={editLabel} onChange={e => setEditLabel(e.target.value)} /></div>
        <div style={{marginBottom:14}}><label style={labelStyle}>Time (optional)</label><input style={inputStyle} value={editTime} onChange={e => setEditTime(e.target.value)} /></div>
        <div style={{marginBottom:20}}><label style={labelStyle}>Color</label><div style={{display:"flex",flexWrap:"wrap",gap:8}}>
          {COLOR_OPTIONS.map(c => <div key={c.hex} onClick={() => setEditColor(c.hex)} style={{ width:32,height:32,borderRadius:8,background:c.hex,cursor:"pointer",border: editColor===c.hex ? "3px solid #2D3436" : "3px solid transparent" }} title={c.name} />)}
        </div></div>
        <div style={{display:"flex",gap:10}}>
          <button onClick={saveEditEvent} style={{ ...btnBase, flex:1, padding:"12px", fontSize:14, background:"linear-gradient(135deg, #0984E3, #74B9FF)", color:"#fff" }}>Save</button>
          <button onClick={deleteEditEvent} style={{ ...btnBase, flex:1, padding:"12px", fontSize:14, background:"linear-gradient(135deg, #E74C3C, #FF7675)", color:"#fff" }}>Delete</button>
        </div>
      </Modal>}

      {/* PASTE & PARSE */}
      {showPaste && <Modal title="📋 Paste & Parse" onClose={() => setShowPaste(false)}>
        {!parsedEvents ? (
          <div>
            <div style={{fontSize:12,color:"#636E72",fontWeight:600,marginBottom:12}}>
              Paste a WhatsApp message, email, or schedule. Put one event per line with a date and name; time is optional.
            </div>
            <div style={{fontSize:11,color:"#E74C3C",fontWeight:600,marginBottom:8,lineHeight:1.5}}>
              Examples that work well:<br/>
              • 08/20 2pm-4pm Swimming<br/>
              • Aug 22, 10:00 AM – 12:00 PM Art Class<br/>
              • 25 Aug 9am Ballet<br/>
              • Every Thursday until 11/26 10am TWD
            </div>
            <textarea style={{ ...inputStyle, minHeight:120, resize:"vertical", marginBottom:14 }}
              value={pasteText} onChange={e => setPasteText(e.target.value)} />
            {parseError && <div style={{fontSize:12,color:"#E74C3C",fontWeight:700,marginBottom:10}}>{parseError}</div>}
            <button onClick={handleParse}
              style={{ ...btnBase, width:"100%", padding:"12px", fontSize:15,
                background: "linear-gradient(135deg, #FDCB6E, #F39C12)", color:"#fff" }}>
              📋 Parse Text
            </button>
          </div>
        ) : (
          <div>
            <div style={{fontSize:12,color:"#636E72",fontWeight:600,marginBottom:12}}>
              {parsedEvents.length} event{parsedEvents.length !== 1 ? "s" : ""} found. Review and remove any you don't want, then confirm.
            </div>
            <div style={{maxHeight:300,overflowY:"auto",marginBottom:14}}>
              {parsedEvents.map((ev, i) => (
                <div key={i} style={{ display:"flex", alignItems:"center", justifyContent:"space-between", padding:"8px 10px",
                  background:`${ev.color || "#2196F3"}15`, borderLeft:`4px solid ${ev.color || "#2196F3"}`, borderRadius:8, marginBottom:6 }}>
                  <div>
                    <div style={{fontSize:13,fontWeight:700,color:"#2D3436"}}>{ev.label}</div>
                    <div style={{fontSize:11,fontWeight:600,color:"#636E72"}}>{ev.date}{ev.time ? ` · ${ev.time}` : ""}</div>
                  </div>
                  <button onClick={() => removeParsedEvent(i)}
                    style={{ ...btnBase, background:"#FFE0E0", color:"#E74C3C", padding:"4px 10px", fontSize:11 }}>✕</button>
                </div>
              ))}
            </div>
            <div style={{display:"flex",gap:10}}>
              <button onClick={confirmParsed}
                style={{ ...btnBase, flex:1, padding:"12px", fontSize:14, background:"linear-gradient(135deg, #00B894, #55EFC4)", color:"#fff" }}>
                ✓ Add {parsedEvents.length} Event{parsedEvents.length !== 1 ? "s" : ""}
              </button>
              <button onClick={() => setParsedEvents(null)}
                style={{ ...btnBase, flex:1, padding:"12px", fontSize:14, background:"#F0F0F0", color:"#636E72" }}>
                ← Back
              </button>
            </div>
          </div>
        )}
      </Modal>}
    </div>
  );
}

ReactDOM.render(React.createElement(CCCalendar), document.getElementById("root"));
</script>
</body>
</html>
